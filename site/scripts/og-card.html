<!doctype html>
<!-- Source of public/og.png (Open Graph / Twitter card). Render at a 1200x630 viewport, deviceScaleFactor 1,
     after document.fonts.ready, and screenshot .card. Colors and font stacks come from brand/tokens.css. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Imbo Open Graph card</title>
    <link rel="stylesheet" href="../../../brand/tokens.css" />
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../src/fonts/jetbrains-mono-v24-latin-vf.woff2") format("woff2");
        font-weight: 100 800;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Geist Pixel Circle";
        src: url("../src/fonts/GeistPixel-Circle.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        background: var(--semantic-color-surface-background);
      }
      .card {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: 1200px;
        height: 630px;
        padding: 56px 80px;
        overflow: hidden;
        background: var(--semantic-color-surface-background);
        color: var(--semantic-color-text-primary);
        font-family: var(--semantic-typography-body-font-family);
      }
      .wordmark {
        display: block;
        width: 184px;
        height: auto;
      }
      .title {
        margin: 36px 0 0;
        font-family: var(--semantic-typography-display-hero-font-family);
        font-size: 104px;
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: 0;
      }
      .title span {
        display: block;
      }
      .lead {
        margin: 24px 0 0;
        font-size: 28px;
        line-height: 1.5;
        color: var(--semantic-color-text-secondary);
      }
      .install {
        margin: auto 0 0;
        font-size: 24px;
        line-height: 1.2;
      }
      .install span {
        color: var(--semantic-color-text-tertiary);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="wordmark" src="../../../brand/releases/1.0.0/logo/imbo-wordmark-dark.svg" alt="imbo" />
      <h1 class="title"><span>Inbox</span><span>for agents.</span></h1>
      <p class="lead">Your coding agent messages other people’s agents directly — whichever tool they use.</p>
      <p class="install"><span>$</span> curl -fsSL https://imbo.dev/install | sh</p>
    </main>
  </body>
</html>
